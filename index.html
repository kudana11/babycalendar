<style>
/* Layout: one-column phone app — kid tabs → week timetable (Mon–Sun × hours) → selected-day agenda; bottom sheets for add/edit */
:root{
  --bg:#FBF7FF; --surface:#FFFFFF; --soft:#F4EEFC; --ink:#3B3355; --muted:#8A82A3; --line:#ECE5F6;
  --accent:#FF7FA8; --accent-soft:#FFE1EB; --mint:#7FD3BA; --sky:#8EC5FF; --sun:#FFD66B;
  --sat:#5B8FE0; --sun-day:#F06C93; --on-pastel:#3B3355; --shadow:0 6px 20px rgba(90,70,140,.10);
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1A28; --surface:#28243A; --soft:#322D47; --ink:#F3EFFB; --muted:#A9A1C4; --line:#3A3452;
  --accent:#FF94B8; --accent-soft:#4A2E40; --sat:#8DB6FF; --sun-day:#FF8FB1; --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1A28; --surface:#28243A; --soft:#322D47; --ink:#F3EFFB; --muted:#A9A1C4; --line:#3A3452;
  --accent:#FF94B8; --accent-soft:#4A2E40; --sat:#8DB6FF; --sun-day:#FF8FB1; --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.logo h1{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill-btn.icon{width:34px;padding:0;justify-content:center}
.pill-btn.lang{font-family:var(--f-display);font-size:14px;padding:0 11px}
.ic-grp{font-size:11.5px;color:var(--muted);margin-top:4px}
.logo .mark{width:34px;height:34px;flex:none}
.pill-btn{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:17px;background:var(--surface);box-shadow:var(--shadow);font-size:13px}
.pill-btn svg{width:16px;height:16px}
.ro{font-size:11px;color:var(--muted);background:var(--soft);padding:3px 8px;border-radius:10px}

/* kid tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:26px;background:var(--surface);box-shadow:var(--shadow);border:2px solid transparent}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tab .nm{font-family:var(--f-display);font-size:16px;line-height:1.1}
.tab .ag{font-size:11px;color:var(--muted);line-height:1.1}
.tab .stack{display:flex}
.tab .stack svg{margin-left:-10px;border:2px solid var(--surface);border-radius:50%}
.tab .stack svg:first-child{margin-left:0}
.tab.add{padding:6px 14px;color:var(--muted);gap:4px}

/* nav */
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav .arrow{width:34px;height:34px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:18px}
.nav .label{font-family:var(--f-display);font-size:19px;padding:0 6px;display:flex;align-items:center;gap:4px}
.nav .label small{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.nav .sp{flex:1}
.seg{display:flex;background:var(--soft);border-radius:18px;padding:3px}
.seg button{padding:5px 14px;border-radius:15px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(90,70,140,.12)}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip svg{width:20px;height:20px;flex:none}

/* week grid */
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.wk{--H:42px;touch-action:pan-y}
.wk-head,.wk-care,.wk-body{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr))}
.wk-head{padding:10px 4px 6px;border-bottom:1.5px dashed var(--line)}
.dh{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;border-radius:14px}
.dh .w{font-size:11px;color:var(--muted)}
.dh .d{font-family:var(--f-display);font-size:17px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.dh.sat .w,.dh.sat .d{color:var(--sat)} .dh.sun .w,.dh.sun .d{color:var(--sun-day)}
.dh.today .d{background:var(--accent);color:#fff}
.dh.sel{background:var(--soft)}
.wk-care{padding:4px 4px;border-bottom:1.5px dashed var(--line);min-height:30px;align-items:center}
.wk-care .lab{font-size:9px;color:var(--muted);text-align:center;line-height:1.1}
.adc{display:flex;flex-direction:column;gap:2px;padding:0 1px;min-width:0}
.hol{font-size:9px;line-height:1.1;color:var(--sun-day);text-align:center;word-break:keep-all}
.adb{display:flex;align-items:center;gap:1px;border-radius:6px;padding:1px 2px;color:var(--on-pastel);min-width:0}
.adb svg{width:12px;height:12px;flex:none}
.adb span{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .hn{font-size:8.5px;color:var(--sun-day);line-height:1.1;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hol-card{display:flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--sun-day);border-radius:14px;padding:8px 12px;font-family:var(--f-display);font-size:15px}
.cg{display:flex;justify-content:center;flex-wrap:wrap;gap:1px}
.cg svg{width:20px;height:20px}
.wk-body{padding:0 4px 8px;position:relative}
.hrs{position:relative}
.hrs span{position:absolute;right:4px;font-size:10px;color:var(--muted);transform:translateY(-50%)}
.col{position:relative;border-left:1px solid var(--line);
  background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--H))}
.col.sel{background-color:color-mix(in srgb,var(--soft) 60%,transparent)}
.blk{position:absolute;border-radius:9px;padding:3px 3px 2px;overflow:hidden;color:var(--on-pastel);text-align:left;
  display:flex;flex-direction:column;gap:1px;box-shadow:0 1px 0 rgba(0,0,0,.06);border:1.5px solid rgba(255,255,255,.7)}
.blk svg{width:15px;height:15px;flex:none}
.blk .t{font-size:10px;line-height:1.15;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.care{position:absolute;left:0;right:0;border-radius:0;opacity:.42;display:flex;justify-content:center;padding-top:2px}
.care svg{width:16px;height:16px;opacity:1}
.now{position:absolute;left:-2px;right:0;height:2px;background:var(--accent);z-index:3}
.now::before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* month grid */
.mo-head,.mo-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mo-head{padding:10px 6px 4px}
.mo-head div{text-align:center;font-size:11px;color:var(--muted)}
.mo-head div:nth-child(6){color:var(--sat)} .mo-head div:nth-child(7){color:var(--sun-day)}
.mo-grid{gap:3px;padding:4px 6px 8px}
.mc{min-height:66px;border-radius:12px;padding:4px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid transparent}
.mc.out{opacity:.35}
.mc.sel{border-color:var(--accent);background:var(--accent-soft)}
.mc .d{font-family:var(--f-display);font-size:14px;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.mc.today .d{background:var(--accent);color:#fff}
.mc.sat .d{color:var(--sat)} .mc.sun .d{color:var(--sun-day)}
.mc.today .d{color:#fff}
.mc .ic{display:flex;flex-wrap:wrap;justify-content:center;gap:1px}
.mc .ic span{width:18px;height:18px;border-radius:6px;display:grid;place-items:center}
.mc .ic svg{width:14px;height:14px}
.mc .more{font-size:9px;color:var(--muted)}

/* agenda */
.day-h{display:flex;align-items:baseline;gap:8px;padding:0 4px}
.day-h h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0}
.day-h span{color:var(--muted);font-size:12px}
.agenda{display:flex;flex-direction:column;gap:10px}
.ev{display:grid;grid-template-columns:52px 44px minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--shadow);text-align:left;width:100%}
.ev .tm{font-size:13px;line-height:1.25}
.ev .tm small{display:block;color:var(--muted);font-size:11px}
.ev .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.ev .ico svg{width:30px;height:30px}
.ev .bd{min-width:0;display:flex;flex-direction:column;gap:5px}
.ev .tt{font-family:var(--f-display);font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.ev .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px 2px 3px;border-radius:12px;background:var(--soft)}
.tag.plain{padding:2px 8px}
.tag svg{width:18px;height:18px}
.tag.solo{background:#E3F6EF;color:#2E6B58} .tag.with{background:#FFF1CC;color:#7A5A12}
.tag.ex{background:var(--line);color:var(--muted)}
.ev.care-card{background:linear-gradient(100deg,var(--cg) 0%,var(--surface) 75%)}
.ev.care-card .tt{color:var(--on-pastel)}
.empty{background:var(--surface);border-radius:20px;padding:22px 18px;text-align:center;color:var(--muted);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:17px}
.mode-note{font-size:11.5px;color:var(--muted);text-align:center}

/* fab */
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 14px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:20;
  height:56px;padding:0 22px 0 16px;border-radius:28px;background:var(--accent);color:#fff;font-family:var(--f-display);font-size:18px;
  display:flex;align-items:center;gap:6px;box-shadow:0 10px 24px rgba(255,110,160,.4)}
.fab svg{width:26px;height:26px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(40,30,60,.38);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;border-radius:26px 26px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh-top{display:flex;align-items:center;gap:8px;padding:14px max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px))}
.sh-top h3{flex:1;margin:0;font-family:var(--f-display);font-weight:400;font-size:21px}
.x{width:34px;height:34px;border-radius:50%;background:var(--soft);font-size:18px}
.sh-body{overflow-y:auto;padding:4px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.fld>.lb{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
input[type=text],input[type=date],input[type=time],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.wrapchips{display:flex;flex-wrap:wrap;gap:6px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.pre{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);font-size:12px;text-align:center;line-height:1.2}
.pre svg{width:32px;height:32px}
.pre[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pre small{color:var(--muted);font-size:10.5px}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.icons button{height:44px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center}

.icons button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.chars button{border-radius:50%;border:3px solid transparent;aspect-ratio:1;max-width:100%}
.chars button svg{width:100%;height:100%}
.chars button[aria-pressed="true"]{border-color:var(--accent)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent)}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);padding:4px;border-radius:18px}
.kind button{padding:9px;border-radius:14px;font-family:var(--f-display);font-size:16px;color:var(--muted)}
.kind button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(90,70,140,.12)}
.btns{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
.btn{flex:1;height:50px;border-radius:16px;font-family:var(--f-display);font-size:17px;background:var(--soft)}
.btn.pri{background:var(--accent);color:#fff}
.btn.del{flex:none;padding:0 16px;color:var(--sun-day)}
.delask{border:2px solid var(--sun-day)}
.delask .btn{flex:none;width:100%}
.btn.danger{background:var(--sun-day);color:#fff}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.del.armed{background:var(--sun-day);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--surface);text-align:left;width:100%}
.li svg.av{width:40px;height:40px;flex:none}
.li .ic2{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft);flex:none}
.li .ic2 svg{width:28px;height:28px}
.li .tx{flex:1;min-width:0}
.li .tx b{font-family:var(--f-display);font-weight:400;font-size:16px;display:block}
.li .tx small{color:var(--muted);font-size:12px}
.li .go{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6}
.help{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.help b{font-family:var(--f-display);font-weight:400;font-size:16px}
.yr{display:flex;align-items:center;justify-content:center;gap:16px;font-family:var(--f-display);font-size:22px}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.months button{height:48px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-family:var(--f-display);font-size:16px}
.months button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:13px;z-index:60;max-width:calc(100% - 40px)}
.sub-tabs{display:flex;gap:6px}
</style>

function trs(t){ if(LANG!=='en'||!t) return t; const k=t.trim(); if(!k||!/[가-힣]/.test(k)) return t; const r=EN[k]; return r===undefined?t:t.replace(k,r); }
function localize(root){ if(LANG!=='en'||!root) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n; while((n=w.nextNode())){ const v=n.nodeValue; if(/[가-힣]/.test(v)){ const r=trs(v); if(r!==v) n.nodeValue=r; } }
  root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>{ for(const a of ['placeholder','aria-label','title']){ const v=el.getAttribute(a); if(v&&/[가-힣]/.test(v)){ const r=trs(v); if(r!==v) el.setAttribute(a,r); } } }); }

const matchKid=ev=>S.kid==='all'||!(ev.kids&&ev.kids.length)||ev.kids.includes(S.kid);
function occs(from,to){
  const out=[];
  for(const ev of Object.values(S.events)){
    if(!matchKid(ev)) continue;
    if(!ev.repeat){ const e=ev.allDay?[ev.endDate||ev.date,ev.date].sort()[1]:ev.date;
      if(ev.date<=to&&e>=from){ if(ev.allDay){ let d=parse([from,ev.date].sort()[1]); const end=[to,e].sort()[0]; while(ymd(d)<=end){out.push({ev,date:ymd(d)}); d=addDays(d,1);} } else out.push({ev,date:ev.date}); }
      continue; }
    const end=[to,ev.until||'9999-12-31'].sort()[0];
    let d=parse([from,ev.date].sort()[1]);
    while(ymd(d)<=end){ const s=ymd(d); if((ev.days||[]).includes(wdi(d))&&!(ev.ex||[]).includes(s)) out.push({ev,date:s}); d=addDays(d,1); }
  }
  for(const kd of Object.values(S.kids)){
    if(!kd.birth||(S.kid!=='all'&&S.kid!==kd.id)) continue;
    const [by,bm,bd]=kd.birth.split('-').map(Number); if(!by||!bm||!bd) continue;
    for(let y=Math.max(by,+from.slice(0,4)); y<=+to.slice(0,4); y++){
      const leap=y%4===0&&(y%100!==0||y%400===0); const dd=(bm===2&&bd===29&&!leap)?28:bd;
      const ds=`${y}-${pad(bm)}-${pad(dd)}`; if(ds<from||ds>to) continue;
      const age=y-by;
      out.push({ev:{id:'bday-'+kd.id,kind:'event',virtual:true,allDay:true,date:ds,icon:'cake',kids:[kd.id],
        title:age?K(`${kd.name} 생일 · 만 ${age}세`,`${kd.name}'s birthday · turns ${age}`):K(`${kd.name} 태어난 날`,`${kd.name} was born`)},date:ds});
    }
  }
  const k=ev=>ev.allDay?-1:tm(ev.start);
  return out.sort((a,b)=>a.date.localeCompare(b.date)||k(a.ev)-k(b.ev));
}

  if(!ks.length) return '#E8E1F2';

}

function weekGrid(){
  const ws=weekStart(S.anchor); const days=[...Array(7)].map((_,i)=>addDays(ws,i)); const ds=days.map(ymd);
  const all=occs(ds[0],ds[6]); const list=all.filter(o=>!o.ev.allDay);
  let h0=24,h1=0;
  list.forEach(({ev})=>{h0=Math.min(h0,Math.floor(tm(ev.start)/60)); h1=Math.max(h1,Math.ceil((tm(ev.end)||tm(ev.start)+60)/60));});
  if(!list.length){h0=9;h1=18} if(h1-h0<6){h1=Math.min(24,h0+6)} h0=Math.max(0,h0); h1=Math.min(24,h1);
  const H=h1-h0<=8?58:h1-h0<=11?48:40;
  const head=`<div class="wk-head"><div></div>${days.map((d,i)=>`<button class="dh ${HOLI[ds[i]]||i===6?'sun':i===5?'sat':''} ${ds[i]===TODAYS?'today':''} ${ds[i]===S.sel?'sel':''}" data-day="${ds[i]}"><span class="w">${WD[i]}</span><span class="d num">${d.getDate()}</span></button>`).join('')}</div>`;
  const hasAd=ds.some(s=>HOLI[s])||all.some(o=>o.ev.allDay);
  const adRow=hasAd?`<div class="wk-care"><div class="lab">종일</div>${ds.map(s=>`<div class="adc">${HOLI[s]?`<span class="hol">${esc(holi(s))}</span>`:''}${all.filter(o=>o.date===s&&o.ev.allDay).map(o=>`<button class="adb" data-occ="${o.ev.id}|${s}" style="background:${evColor(o.ev)}">${icon(evIcon(o.ev))}<span>${esc(evTitle(o.ev))}</span></button>`).join('')}</div>`).join('')}</div>`:'';
  const careRow=`<div class="wk-care"><div class="lab">돌봄</div>${ds.map(s=>{const cg=[...new Set(list.filter(o=>o.date===s&&o.ev.kind==='care').map(o=>o.ev.caregiver))].map(id=>S.people[id]).filter(Boolean);
    return `<div class="cg">${cg.map(p=>avatar(p.char,p.color,20)).join('')}</div>`}).join('')}</div>`;
  const hrs=`<div class="hrs" style="height:${(h1-h0)*H}px">${[...Array(h1-h0)].map((_,i)=>i?`<span class="num" style="top:${i*H}px">${h0+i}</span>`:'').join('')}</div>`;
  const cols=ds.map(s=>{
    const dayO=list.filter(o=>o.date===s);
    const cares=dayO.filter(o=>o.ev.kind==='care'), evs=dayO.filter(o=>o.ev.kind!=='care');
    // lanes
    const lanes=[]; const pos=evs.map(o=>{const st=tm(o.ev.start),en=Math.max(tm(o.ev.end)||st+60,st+20);let l=0;while(lanes[l]&&lanes[l]>st)l++;lanes[l]=en;return{o,st,en,l}});
    pos.forEach(p=>{p.n=1+Math.max(...pos.filter(q=>q.st<p.en&&q.en>p.st).map(q=>q.l))});
    const careHTML=cares.map(o=>{const st=tm(o.ev.start),en=tm(o.ev.end)||st+60;const p=S.people[o.ev.caregiver]||{};
      return `<button class="care" data-occ="${o.ev.id}|${s}" style="top:${(st/60-h0)*H}px;height:${(en-st)/60*H}px;background:${p.color||'#E8E1F2'}" aria-label="${esc(evTitle(o.ev))}"></button>`}).join('');
    const evHTML=pos.map(({o,st,en,l,n})=>{const h=(en-st)/60*H;
      return `<button class="blk" data-occ="${o.ev.id}|${s}" style="top:${(st/60-h0)*H+1}px;height:${h-2}px;left:calc(${l*100/n}% + 3px);width:calc(${100/n}% - 4px);background:${evColor(o.ev)}">${icon(evIcon(o.ev))}${h>30&&n<3?`<span class="t">${esc(evTitle(o.ev))}</span>`:''}</button>`}).join('');
    let now=''; if(s===TODAYS){const m=TODAY.getHours()*60+TODAY.getMinutes(); if(m>=h0*60&&m<=h1*60) now=`<div class="now" id="nowline" style="top:${(m/60-h0)*H}px"></div>`;}
    return `<div class="col ${s===S.sel?'sel':''}" data-col="${s}" data-h0="${h0}" data-hh="${H}" style="height:${(h1-h0)*H}px;--H:${H}px">${careHTML}${evHTML}${now}</div>`;
  }).join('');
  return `<div class="card wk" id="grid">${head}${adRow}${careRow}<div class="wk-body" style="padding-top:8px">${hrs}${cols}</div></div>`;
}
function monthGrid(){
  const a=S.anchor; const first=new Date(a.getFullYear(),a.getMonth(),1); const gs=weekStart(first);
  const last=new Date(a.getFullYear(),a.getMonth()+1,0); const ge=addDays(weekStart(last),6);

function bindEvent(){
  const root=document.querySelector('.sh-body');
  root.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; const d=b.dataset;
    if(d.close) return; syncF();
    if(d.k){F.kind=d.k; if(d.k==='care')F.allDay=false;}
    else if(d.allday){F.allDay=d.allday==='1'; if(F.allDay){F.repeat=false; if(!F.endDate||F.endDate<F.date)F.endDate=F.date;}}
    else if(d.pre){const p=S.presets[d.pre]; F._preset=p.id; F.title=p.name; F.icon=p.icon; if(p.start)F.start=p.start; F.end=hhmm(tm(F.start)+(p.dur||60)); F.place=p.place||''; F.with=[...(p.with||[])]; if(p.kids&&p.kids.length)F.kids=[...p.kids]; F.allDay=!!p.allDay; if(F.allDay){F.repeat=false;F.endDate=ymd(addDays(parse(F.date),Math.max(0,(p.nights||0))));} else if(p.days&&p.days.length){F.repeat=true;F.days=[...p.days];}}
    else if(d.ic){F.icon=d.ic}
    else if(d.fk){const s=new Set(F.kids||[]); s.has(d.fk)?s.delete(d.fk):s.add(d.fk); F.kids=[...s]}
    else if(d.cg){F.caregiver=d.cg}
    else if(d.dur){F.end=hhmm(tm(F.start)+ +d.dur)}
    else if(d.rep){F.repeat=d.rep==='1'; if(F.repeat&&!(F.days||[]).length) F.days=[wdi(parse(F.date))]}
    else if(d.wd){const s=new Set(F.days||[]); const i=+d.wd; s.has(i)?s.delete(i):s.add(i); F.days=[...s]}
    else if(d.solo){F.with=[]}
    else if(d.w){const s=new Set(F.with||[]); s.has(d.w)?s.delete(d.w):s.add(d.w); F.with=[...s]}
    else if(d.scope){F._scope=d.scope}
    else if(d.savepre){ if(!F.title){toast('무엇을 하는지 먼저 적어 주세요');return}
      put('presets',{id:uid(),name:F.title,icon:F.icon,start:F.start,dur:Math.max(10,tm(F.end)-tm(F.start)),place:F.place||'',with:F.with||[],kids:F.kids||[],days:F.repeat?F.days:[],order:presetList().length}); toast(K(`'${F.title}' 프리셋을 만들었어요`,`Preset '${F.title}' created`)); return }

    else if(d.dx){ if(d.dx==='cancel'){F._delAsk=false} else return deleteEvent(d.dx) }
    else return;
    drawSheet();
  };
}
function cleanF(){ const o={...F}; delete o._occ; delete o._scope; delete o._new; delete o._preset; delete o._odate; delete o._delAsk;
  if(o.kind==='care'){delete o.with;delete o.place;delete o.title;delete o.icon}
  if(!o.repeat){delete o.days;delete o.until;delete o.ex}
  if(!o.allDay){delete o.allDay;delete o.endDate} return o; }
function saveEvent(){
  syncF();
  if(F.kind==='care'&&!F.caregiver) return toast('누가 돌봐주는지 골라 주세요');
  if(F.kind!=='care'&&!F.title) return toast('무엇을 하는지 적어 주세요');
  if(!F.date||!F.start) return toast('날짜와 시작 시간을 넣어 주세요');
  if(F.allDay){ if(!F.endDate||F.endDate<F.date) F.endDate=F.date; F.repeat=false; }
  else if(F.end&&tm(F.end)<=tm(F.start)) return toast('끝나는 시간이 시작보다 늦어야 해요');
  if(F.repeat&&!(F.days||[]).length) return toast('반복할 요일을 골라 주세요');
  const orig=S.events[F.id];
  if(!F._new&&orig&&orig.repeat&&F._scope==='one'){
    const occ=F._occ; put('events',{...orig,ex:[...(orig.ex||[]),occ]});
    const one=cleanF(); one.id=uid(); one.repeat=false; one.date=F._odate||occ; delete one.days; delete one.until; delete one.ex; delete one.sample;
    put('events',one);
  } else if(!F._new&&orig&&orig.repeat&&F._scope==='future'&&F._occ>orig.date){
    const occ=F._occ; put('events',{...orig,until:ymd(addDays(parse(occ),-1))});
    const nx=cleanF(); nx.id=uid(); nx.date=F._odate||occ; nx.ex=(orig.ex||[]).filter(x=>x>=nx.date); delete nx.sample;
    if(!nx.repeat){delete nx.days;delete nx.until;delete nx.ex}
    put('events',nx);
  } else {
    const o=cleanF(); if(o.repeat&&F._new===false&&orig&&!orig.repeat) o.date=F.date; put('events',o);
  }
  const d=F.repeat?F._occ||F.date:F.date; S.sel=d; S.anchor=parse(d);
  closeSheet(); toast(F._new?'추가했어요':'수정했어요'); render();
}
function delAsk(){
  const o=S.events[F.id]||F; const occ=parse(F._occ); const md=`${occ.getMonth()+1}/${occ.getDate()}`;
  return `<div class="help delask" role="alertdialog" aria-label="반복 일정 삭제"><b>반복 일정을 지울까요?</b>

}
function deleteEvent(mode){
  const orig=S.events[F.id]; if(!orig) return closeSheet();
  if(orig.repeat&&mode==='one'){ put('events',{...orig,ex:[...(orig.ex||[]),F._occ]}); toast('이 날 일정만 지웠어요'); }
  else if(orig.repeat&&mode==='future'&&F._occ>orig.date){ put('events',{...orig,until:ymd(addDays(parse(F._occ),-1))}); toast('앞으로의 반복 일정을 모두 지웠어요'); }
  else { del('events',F.id); toast(orig.repeat?'반복 일정을 전부 지웠어요':'삭제했어요'); }
  closeSheet();
}

}
function charPicker(list,cur,color){ return `<div class="chars">${list.map(c=>`<button type="button" aria-pressed="${cur===c}" data-ch="${c}" aria-label="${CHAR[c].n}">${avatar(c,color,52)}</button>`).join('')}</div>`; }
function swatches(cur){ return `<div class="sw">${PASTELS.map(c=>`<button type="button" aria-pressed="${cur===c}" data-co="${c}" style="background:${c}" aria-label="색 ${c}"></button>`).join('')}</div>`; }
function formSheet(title,obj,bodyFn,onSave,onDelete,back){
  let O={...obj};
  openSheet(title,()=>bodyFn(O)+`<div class="btns">${onDelete?'<button type="button" class="btn del" data-del="1">삭제</button>':''}<button type="button" class="btn" data-back="1">뒤로</button><button type="button" class="btn pri" data-save="1">저장</button></div>`,()=>{
    const root=document.querySelector('.sh-body');
    const sync=()=>root.querySelectorAll('[data-f]').forEach(el=>O[el.dataset.f]=el.value.trim());
    root.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset; sync();
      if(d.ch)O.char=d.ch; else if(d.co)O.color=d.co; else if(d.ic)O.icon=d.ic; else if(d.role){O.role=d.role; if(!O.name)O.name=d.role; const ri=Math.max(ROLES_K.indexOf(d.role),ROLES_E.indexOf(d.role)); const auto=ri>=0?ROLE_CHAR[ri]:null; if(auto)O.char=auto;}
      else if(d.dur)O.dur=+d.dur; else if(d.allday)O.allDay=d.allday==='1'; else if(d.nights!==undefined)O.nights=+d.nights; else if(d.w){const s=new Set(O.with||[]);s.has(d.w)?s.delete(d.w):s.add(d.w);O.with=[...s]} else if(d.solo)O.with=[];
      else if(d.fk){const s=new Set(O.kids||[]);s.has(d.fk)?s.delete(d.fk):s.add(d.fk);O.kids=[...s]}
      else if(d.wd){const s=new Set(O.days||[]);const i=+d.wd;s.has(i)?s.delete(i):s.add(i);O.days=[...s]}
      else if(d.save){const err=onSave(O); if(err) toast(err); else back(); return}
      else if(d.del){armDelete(b,()=>{onDelete(O);back()});return}
      else if(d.back){back();return} else return;
      drawSheet();};
  });
}
function openKid(k){
  const fromSettings=!!SH;
  const back=()=>fromSettings?openSettings('kids'):closeSheet();
  formSheet(k?'아이 정보':'아이 추가',k||{id:uid(),name:'',birth:'',char:KID_CHARS[kidList().length%KID_CHARS.length],color:PASTELS[kidList().length%PASTELS.length]},O=>`
    <div style="display:flex;justify-content:center">${avatar(O.char,O.color,88)}</div>
    <div class="fld"><label for="k-name">이름</label><input id="k-name" data-f="name" type="text" value="${esc(O.name)}" placeholder="예: 지아"></div>
    <div class="fld"><label for="k-birth">생일</label><input id="k-birth" data-f="birth" type="date" value="${esc(O.birth)}">${O.birth?`<span class="hint num">${ageText(O.birth)}</span>`:''}</div>
    <div class="fld"><span class="lb">캐릭터</span>${charPicker(KID_CHARS,O.char,O.color)}</div>
    <div class="fld"><span class="lb">아이 색 (시간표 블록 색)</span>${swatches(O.color)}</div>`,
    O=>{ if(!O.name) return '이름을 적어 주세요'; put('kids',O); if(!k){S.kid=O.id;saveUI()} toast(K(`${O.name} 저장했어요`,`${O.name} saved`)); },
    k?O=>{del('kids',O.id); if(S.kid===O.id)S.kid='all'}:null, back);
}
function openPerson(p){
  formSheet(p?'함께하는 사람':'사람 추가',p||{id:uid(),name:'',role:'',char:'grandma',color:PASTELS[(peopleList().length+3)%PASTELS.length],order:peopleList().length},O=>`
    <div style="display:flex;justify-content:center">${avatar(O.char,O.color,88)}</div>
    <div class="fld"><span class="lb">관계 (누르면 이름·캐릭터가 채워져요)</span><div class="wrapchips">${(LANG==='en'?ROLES_E:ROLES_K).map(r=>chip(O.role===r,`data-role="${esc(r)}"`,esc(r))).join('')}</div></div>
    <div class="fld"><label for="p-name">부르는 이름</label><input id="p-name" data-f="name" type="text" value="${esc(O.name)}" placeholder="예: 외할머니, 수진 이모님"></div>
    <div class="fld"><span class="lb">캐릭터</span>${charPicker(PEOPLE_CHARS,O.char,O.color)}</div>
    <div class="fld"><span class="lb">색</span>${swatches(O.color)}</div>`,
    O=>{ if(!O.name) return '이름을 적어 주세요'; put('people',O); toast(K(`${O.name} 저장했어요`,`${O.name} saved`)); },
    p?O=>del('people',O.id):null, ()=>openSettings('people'));
}
function openPreset(pr){
  formSheet(pr?'프리셋 고치기':'프리셋 추가',pr||{id:uid(),name:'',icon:'star',start:'',dur:60,place:'',with:[],kids:[],days:[],order:presetList().length},O=>`
    <div class="fld"><label for="r-name">이름</label><input id="r-name" data-f="name" type="text" value="${esc(O.name)}" placeholder="예: 태권도"></div>
    <div class="fld"><span class="lb">그림</span>${iconPicker(O.icon)}</div>
    <div class="wrapchips">${chip(!O.allDay,'data-allday="0"','시간 정하기')}${chip(O.allDay,'data-allday="1"','종일 · 여러 날')}</div>
    ${O.allDay?`<div class="fld"><span class="lb">보통 기간</span><div class="wrapchips">${[0,1,2,3,4,6].map(n=>chip((O.nights||0)===n,`data-nights="${n}"`,fmtNights(n))).join('')}</div></div>`:`
    <div class="fld"><label for="r-start">보통 시작 시간 (선택)</label><input id="r-start" data-f="start" type="time" value="${esc(O.start||'')}"></div>
    <div class="fld"><span class="lb">걸리는 시간</span><div class="wrapchips">${[30,50,60,90,120,180,420].map(m=>chip(O.dur===m,`data-dur="${m}"`,fmtDur(m))).join('')}</div></div>`}
    <div class="fld"><span class="lb">아이 (선택)</span><div class="wrapchips">${kidList().map(k=>chip((O.kids||[]).includes(k.id),`data-fk="${k.id}"`,avatar(k.char,k.color,22)+esc(k.name))).join('')}</div></div>
    <div class="fld"><span class="lb">매주 반복 요일 (선택)</span><div class="wrapchips">${WD.map((w,i)=>chip((O.days||[]).includes(i),`data-wd="${i}"`,w)).join('')}</div></div>
    <div class="fld"><span class="lb">누구랑?</span><div class="wrapchips">${chip(!(O.with||[]).length,'data-solo="1"','아이 혼자')}${peopleList().map(p=>chip((O.with||[]).includes(p.id),`data-w="${p.id}"`,avatar(p.char,p.color,22)+esc(p.name))).join('')}</div></div>
    <div class="fld"><label for="r-place">장소 (선택)</label><input id="r-place" data-f="place" type="text" value="${esc(O.place||'')}"></div>`,
    O=>{ if(!O.name) return '이름을 적어 주세요'; put('presets',O); toast('프리셋을 저장했어요'); },
    pr?O=>del('presets',O.id):null, ()=>openSettings('presets'));
}
function presetSub(p){ if(p.allDay) return p.nights?`${K('종일','All day')} · ${fmtNights(p.nights)}`:K('종일','All day'); return `${p.start?p.start+' · ':''}${fmtDur(p.dur||60)}`; }
function addStarter(){
  put('presets',{id:uid(),name:'가족 휴가',icon:'plane',allDay:true,nights:2,dur:0,start:'',place:'',with:[],kids:[],days:[],order:presetList().length});
  const base=[['소아과','hospital',60],['예방접종','shot',30],['치과','tooth',60],['어린이집','daycare',420],['유치원','kinder',360],['피아노','piano',50],['태권도','tkd',60],['수영','swim',60],['미술','art',60],['발레','ballet',60],['영어','abc',50],['뮤지컬','musical',120],['놀이터','tree',60],['생일 파티','cake',120]];
  const n=presetList().length; base.forEach(([name,ic,dur],i)=>put('presets',{id:uid(),name,icon:ic,dur,start:'',place:'',with:[],kids:[],days:[],order:n+i}));
  toast('기본 프리셋을 넣었어요');
}

init();
</script>
